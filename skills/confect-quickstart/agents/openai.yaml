interface:
  display_name: "Confect Quickstart"
  short_description:
    "Start a new Confect app or add Confect to an existing frontend."
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#F97316"
  default_prompt:
    "Set up Confect (Effect on Convex) for this project as fast as possible.
    First decide whether this is a new app or an existing app, then scaffold or
    integrate Convex and Confect and verify the setup works."

policy:
  allow_implicit_invocation: true
