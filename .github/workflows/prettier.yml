name: Prettier

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format-check

  publish-skills-manifest:
    # Turned off in the Confect fork: this job publishes the upstream Convex manifest.
    if: false
    needs: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm publish-skills-manifest
        env:
          VERSION_CONVEX_DEV_AGENT_SKILLS_SYNC_TOKEN:
            ${{ secrets.VERSION_CONVEX_DEV_AGENT_SKILLS_SYNC_TOKEN }}
